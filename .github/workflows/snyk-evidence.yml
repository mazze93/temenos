name: Snyk paired evidence gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: snyk-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install .
      - uses: snyk/actions/setup@b075801f26076be9bb50521154cafab73f44da0c
        with:
          snyk-version: 'v1.1307.4'
      - name: Collect both Snyk receipts
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          TEMENOS_EVIDENCE_KEY: ${{ secrets.TEMENOS_EVIDENCE_KEY }}
          SNYK_ORG_ID: ${{ vars.SNYK_ORG_ID }}
        shell: bash
        run: |
          set -euo pipefail
          : "${SNYK_TOKEN:?}" "${TEMENOS_EVIDENCE_KEY:?}" "${SNYK_ORG_ID:?}"
          mkdir -p evidence
          scope=(--commit "$GITHUB_SHA" --target sandbox-demonstration --org "$SNYK_ORG_ID")
          temenos snyk-collect --artifact examples/snyk/configmap-clean.yaml "${scope[@]}" --output evidence/clean-receipt.json
          temenos snyk-collect --artifact examples/snyk/deployment.yaml "${scope[@]}" --output evidence/unsafe-receipt.json
      - name: Evaluate both against Stratum
        env:
          TEMENOS_EVIDENCE_KEY: ${{ secrets.TEMENOS_EVIDENCE_KEY }}
          STRATUM_TOKEN: ${{ secrets.STRATUM_TOKEN }}
          TEMENOS_STRATUM_URL: ${{ vars.TEMENOS_STRATUM_URL }}
          TEMENOS_LOG_ID: ${{ vars.TEMENOS_LOG_ID }}
          SNYK_ORG_ID: ${{ vars.SNYK_ORG_ID }}
        shell: bash
        run: |
          set -euo pipefail
          : "${TEMENOS_EVIDENCE_KEY:?}" "${STRATUM_TOKEN:?}" "${TEMENOS_STRATUM_URL:?}" "${TEMENOS_LOG_ID:?}" "${SNYK_ORG_ID:?}"
          scope=(--commit "$GITHUB_SHA" --target sandbox-demonstration --org "$SNYK_ORG_ID")
          set +e
          temenos release-check --artifact examples/snyk/configmap-clean.yaml "${scope[@]}" --receipt evidence/clean-receipt.json > evidence/clean-decision.json
          clean_exit=$?
          temenos release-check --artifact examples/snyk/deployment.yaml "${scope[@]}" --receipt evidence/unsafe-receipt.json > evidence/unsafe-decision.json
          unsafe_exit=$?
          set -e
          python tools/assert_snyk_demo.py \
            --clean-receipt evidence/clean-receipt.json \
            --clean-decision evidence/clean-decision.json --clean-exit "$clean_exit" \
            --unsafe-receipt evidence/unsafe-receipt.json \
            --unsafe-decision evidence/unsafe-decision.json --unsafe-exit "$unsafe_exit"
      - name: Preserve demonstration receipts and decisions
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: snyk-paired-evidence-${{ github.sha }}
          path: evidence/*.json
          retention-days: 14
          if-no-files-found: warn
